<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Intégration d'un registre PDP entre EBP et CEGID">
  <rect width="800" height="450" fill="#eef2ff"/>
  <!-- Carte EBP -->
  <rect x="70" y="150" width="180" height="150" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="160" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#1d4ed8">EBP</text>
  <!-- Carte CEGID -->
  <rect x="550" y="150" width="180" height="150" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="640" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#4338ca">CEGID</text>
  <!-- Base de données centrale (registre PDP) -->
  <g>
    <ellipse cx="400" cy="170" rx="70" ry="22" fill="#6366f1"/>
    <rect x="330" y="170" width="140" height="110" fill="#6366f1"/>
    <ellipse cx="400" cy="280" rx="70" ry="22" fill="#4f46e5"/>
    <ellipse cx="400" cy="205" rx="70" ry="22" fill="#818cf8"/>
    <ellipse cx="400" cy="240" rx="70" ry="22" fill="#818cf8"/>
  </g>
  <text x="400" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#312e81">Registre PDP</text>
  <!-- Connexions -->
  <line x1="250" y1="225" x2="330" y2="225" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round"/>
  <line x1="470" y1="225" x2="550" y2="225" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round"/>
</svg>
