<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Portfolio web moderne développé avec Astro">
  <rect width="800" height="450" fill="#eef2ff"/>
  <!-- Fenêtre navigateur -->
  <rect x="170" y="80" width="460" height="290" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="170" y="80" width="460" height="44" rx="18" fill="#312e81"/>
  <circle cx="200" cy="102" r="7" fill="#f87171"/>
  <circle cx="224" cy="102" r="7" fill="#fbbf24"/>
  <circle cx="248" cy="102" r="7" fill="#34d399"/>
  <rect x="300" y="92" width="300" height="20" rx="10" fill="#4c1d95"/>
  <!-- Balises de code -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="30" font-weight="700">
    <text x="330" y="220" fill="#6366f1">&lt;</text>
    <text x="352" y="220" fill="#4338ca">/</text>
    <text x="374" y="220" fill="#6366f1">&gt;</text>
  </g>
  <!-- Lignes de contenu -->
  <rect x="210" y="260" width="180" height="16" rx="8" fill="#c7d2fe"/>
  <rect x="210" y="290" width="380" height="12" rx="6" fill="#e0e7ff"/>
  <rect x="210" y="312" width="330" height="12" rx="6" fill="#e0e7ff"/>
  <rect x="210" y="334" width="250" height="12" rx="6" fill="#e0e7ff"/>
  <!-- Badge techno -->
  <rect x="470" y="255" width="120" height="34" rx="17" fill="#4f46e5"/>
  <text x="530" y="278" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Astro</text>
</svg>
