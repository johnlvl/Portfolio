<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Portail interne regroupant les outils des collaborateurs">
  <rect width="800" height="450" fill="#eef2ff"/>
  <!-- Fenêtre portail -->
  <rect x="150" y="80" width="500" height="290" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="150" y="80" width="500" height="44" rx="18" fill="#4f46e5"/>
  <text x="400" y="110" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Portail interne EBP</text>
  <!-- Menu latéral -->
  <rect x="150" y="124" width="120" height="246" fill="#e0e7ff"/>
  <rect x="170" y="150" width="80" height="14" rx="7" fill="#a5b4fc"/>
  <rect x="170" y="180" width="80" height="14" rx="7" fill="#a5b4fc"/>
  <rect x="170" y="210" width="80" height="14" rx="7" fill="#818cf8"/>
  <rect x="170" y="240" width="80" height="14" rx="7" fill="#a5b4fc"/>
  <!-- Tuiles d'outils -->
  <g fill="#eef2ff" stroke="#c7d2fe" stroke-width="2">
    <rect x="300" y="150" width="90" height="90" rx="12"/>
    <rect x="410" y="150" width="90" height="90" rx="12"/>
    <rect x="520" y="150" width="90" height="90" rx="12"/>
    <rect x="300" y="260" width="90" height="90" rx="12"/>
    <rect x="410" y="260" width="90" height="90" rx="12"/>
    <rect x="520" y="260" width="90" height="90" rx="12"/>
  </g>
  <g fill="#6366f1">
    <circle cx="345" cy="195" r="18"/>
    <circle cx="455" cy="195" r="18"/>
    <circle cx="565" cy="195" r="18"/>
    <circle cx="345" cy="305" r="18"/>
    <circle cx="455" cy="305" r="18"/>
    <circle cx="565" cy="305" r="18"/>
  </g>
</svg>
